  - classic-models
home: https://github.com/jiridj/classic-models-api
sources:
  - https://github.com/jiridj/classic-models-api
maintainers:
  - name: Jiri De Jagere
    email: jiri.dejagere@ibm.com
  - name: Fabien Sanglier
    email: fabien.sanglier@ibm.com

# Dependencies
dependencies:
  - name: mysql
    version: "12.3.5"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: mysql.enabled
    tags:
      - database

