apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classic-models-api.fullname" . }}
  labels:
    {{- include "classic-models-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "classic-models-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "classic-models-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "classic-models-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.waitForMysql.enabled }}
      initContainers:
      - name: wait-for-mysql
        image: {{ .Values.initContainers.waitForMysql.image }}
        env:
        - name: MYSQL_HOST
          value: {{ include "classic-models-api.mysql.servicename" . | quote }}
        - name: MYSQL_PORT
          value: {{ include "classic-models-api.mysql.port" . | quote }}
        command:
        - sh
        - -c
        - |
          until nc -z "$MYSQL_HOST" "$MYSQL_PORT"; do
            echo "Waiting for MySQL at $MYSQL_HOST:$MYSQL_PORT to be ready..."
            sleep 2
          done
          echo "MySQL is ready!"
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: {{ include "classic-models-api.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: {{ include "classic-models-api.fullname" . }}
              key: debug
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: {{ include "classic-models-api.fullname" . }}
              key: api-version
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: {{ include "classic-models-api.fullname" . }}
              key: allowed-hosts
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "classic-models-api.secretKeySecretName" . }}
              key: {{ include "classic-models-api.secretKeySecretKey" . }}
        {{- if or .Values.app.apiKey .Values.externalSecrets.apiKey.name }}
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "classic-models-api.apiKeySecretName" . }}
              key: {{ include "classic-models-api.apiKeySecretKey" . }}
        {{- end }}
        - name: MYSQL_HOST
          value: {{ include "classic-models-api.mysql.servicename" . }}
        - name: MYSQL_PORT
          value: {{ include "classic-models-api.mysql.port" . | quote }}
        - name: MYSQL_DATABASE
          value: {{ include "classic-models-api.mysql.database" . }}
        - name: MYSQL_USER
          value: {{ include "classic-models-api.mysql.username" . }}
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "classic-models-api.mysqlPasswordSecretName" . }}
              key: {{ include "classic-models-api.mysqlPasswordSecretKey" . }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

