# Default values for classic-models-api
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Set to true if deploying on OpenShift (boolean or string "true"/"false")
  openshift: false
  security:
    # Allow bitnamilegacy images (Bitnami moved images to legacy registry)
    allowInsecureImages: true

# API Application Configuration
replicaCount: 2

image:
  # Full image repository path
  # Examples:
  #   - Docker Hub: "myorg/classic-models-api"
  #   - Private registry: "registry.example.com/myorg/classic-models-api"
  #   - OpenShift internal: "image-registry.openshift-image-registry.svc:5000/myproject/classic-models-api"
  repository: classic-models-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application configuration
app:
  debug: false
  apiVersion: "1.0.0"
  # Django secret key - generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  # Ignored when externalSecrets.djangoSecretKey.name is set.
  secretKey: "change-me-in-production"
  # Optional API key for system-level access.
  # Ignored when externalSecrets.apiKey.name is set.
  apiKey: ""
  # Allowed hosts (comma-separated)
  allowedHosts: "*"

# External Database Configuration
# Connection details for the MySQL / MariaDB instance managed outside this chart
# (e.g. created by an operator, a cloud-managed service, or another deployment).
# externalDB.password is ignored when externalSecrets.mysqlPassword.name is set —
# in that case the password is sourced from the referenced Kubernetes Secret.
externalDB:
  host: ""        # Required — hostname or IP (e.g. "mysql.example.com", "10.0.0.5")
  port: 3306
  database: "classicmodels"
  username: "classicuser"
  # Plain-text password. Leave blank and set externalSecrets.mysqlPassword instead
  # to avoid embedding credentials in values files.
  password: ""

# External secret references
# When a name is provided, the chart will NOT store that value in its own
# managed Secret and will instead reference the pre-existing Kubernetes Secret.
# Each value may point to a different Secret object.
# If ALL secret names are set, the chart-managed Secret is skipped entirely.
externalSecrets:
  # Django SECRET_KEY
  djangoSecretKey:
    name: ""   # Name of the existing Kubernetes Secret (e.g. "my-app-secrets")
    key: ""    # Key inside that Secret (e.g. "django-secret-key")
  # Optional API_KEY (only mounted when name is set or app.apiKey is non-empty)
  apiKey:
    name: ""   # Name of the existing Kubernetes Secret
    key: ""    # Key inside that Secret (e.g. "api-key")
  # Database password — externalDB.password is ignored when this is set
  mysqlPassword:
    name: ""   # Name of the existing Kubernetes Secret (e.g. "my-db-secrets")
    key: ""    # Key inside that Secret (e.g. "mysql-password")
  # Database username — takes precedence over externalDB.username when set
  dbUsername:
    name: ""   # Name of the existing Kubernetes Secret
    key: ""    # Key inside that Secret (e.g. "db-username")
  # Database name — takes precedence over externalDB.database when set
  dbDatabase:
    name: ""   # Name of the existing Kubernetes Secret
    key: ""    # Key inside that Secret (e.g. "db-database")

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

# Route configuration (OpenShift)
route:
  enabled: false
  host: ""  # Leave empty to auto-generate
  path: /
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}

# Ingress configuration (Kubernetes)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: classic-models-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: classic-models-api-tls
  #    hosts:
  #      - classic-models-api.local

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Liveness and readiness probes
#
# livenessProbe  → GET /health
#   Plain Django view outside the classic-models/ prefix.
#   Fast and lightweight: only checks that the process is alive and the DB
#   connection is reachable. No DRF overhead, no authentication required.
#   A failure here means Kubernetes should *restart* the pod.
#
# readinessProbe → GET /classic-models/health
#   DRF APIView inside the classic-models/ prefix (AllowAny, no throttle).
#   Exercises the full Django + DRF middleware stack and runs a lightweight
#   ORM query to confirm migrations are applied and the app is ready to serve
#   traffic. A failure here removes the pod from the Service endpoint slice
#   without triggering a restart.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /classic-models/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Init container to wait for the database to become reachable
initContainers:
  waitForDB:
    enabled: true
    image: busybox:1.35

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# Container security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

